name: 更新 MX-5 車源

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小時一次（UTC 時間，錯開整點尖峰）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取車源
        run: python -m scraper.run

      - name: 儲存結果
        run: |
          git config user.name "mx5-bot"
          git config user.email "mx5-bot@users.noreply.github.com"
          git add docs/data/listings.json
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "更新車源 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
